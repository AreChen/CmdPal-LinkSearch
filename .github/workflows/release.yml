name: Release packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release metadata
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          [xml]$manifest = Get-Content LinkSearch/Package.appxmanifest -Raw
          $version = [version]$manifest.Package.Identity.Version
          $expectedTag = "v$($version.Major).$($version.Minor).$($version.Build)"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Tag $env:GITHUB_REF_NAME does not match package version $version."
          }
          $notesPath = "docs/releases/$env:GITHUB_REF_NAME.md"
          if (-not (Test-Path -LiteralPath $notesPath) -or
              [string]::IsNullOrWhiteSpace((Get-Content -LiteralPath $notesPath -Raw))) {
            throw "Missing release notes: $notesPath"
          }

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test "LinkSearch.sln" -p:Platform=x64 -p:PublishSingleFile=false

      - name: Build MSIX release packages
        shell: pwsh
        run: ./eng/package-release.ps1 -Configuration Release

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: linksearch-release-packages
          path: artifacts/release/*

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: artifacts/release/*
          body_path: docs/releases/${{ github.ref_name }}.md
