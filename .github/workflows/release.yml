name: Release packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test "LinkSearch.sln" -p:Platform=x64 -p:PublishSingleFile=false

      - name: Build MSIX release packages
        shell: pwsh
        run: ./eng/package-release.ps1 -Configuration Release

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: linksearch-release-packages
          path: artifacts/release/*

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: artifacts/release/*
          body: |
            LinkSearch release package.

            Recommended install:
            - Microsoft Store: https://apps.microsoft.com/detail/9MZ9Q4CFP2N9

            Sideload package requirements:
            - Microsoft PowerToys with Command Palette support.
            - Run the included `Add-AppDevPackage.ps1` from the package folder matching your CPU architecture.

            Notes:
            - Microsoft Store is the recommended installation channel.
            - The attached MSIX package is provided as a manual sideload fallback and is signed with a temporary self-signed certificate generated at package time.
